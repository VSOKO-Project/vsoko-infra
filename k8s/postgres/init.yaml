apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
  namespace: vsoko
data:
  10-app-user.sh: |
    #!/bin/sh
    set -eu
    : "${POSTGRES_APP_PASSWORD:?POSTGRES_APP_PASSWORD must not be empty}"
    psql -X --set ON_ERROR_STOP=1 --username "$POSTGRES_USER" --dbname "$POSTGRES_DB" <<'SQL'
    \getenv app_password POSTGRES_APP_PASSWORD
    \getenv db_name POSTGRES_DB
    BEGIN;
    CREATE ROLE vsoko_app LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION
      PASSWORD :'app_password';
    ALTER DATABASE :"db_name" OWNER TO vsoko_app;
    REVOKE ALL ON DATABASE :"db_name" FROM PUBLIC;
    REVOKE ALL ON SCHEMA public FROM PUBLIC;
    GRANT USAGE, CREATE ON SCHEMA public TO vsoko_app;
    COMMIT;
    SQL
