apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: gitlab-vsoko
spec:
  conditions:
    - namespaces:
        - vsoko
  provider:
    gitlab:
      url: https://gitlab.com
      projectID: "79795329"
      environment: "*"
      auth:
        SecretRef:
          accessToken:
            name: gitlab-token
            namespace: vsoko
            key: token
