---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gitlab-registry
  namespace: vsoko
spec:
  refreshInterval: 1m
  secretStoreRef:
    name: gitlab-vsoko
    kind: SecretStore
  target:
    name: gitlab-registry
    creationPolicy: Orphan
    deletionPolicy: Retain
    template:
      engineVersion: v2
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: >-
          {{ dict "auths" (dict "registry.gitlab.com" (dict "username" .username "password" .password "auth" (printf "%s:%s" .username .password | b64enc))) | toJson }}
  data:
    - secretKey: username
      remoteRef:
        key: REGISTRY_USERNAME
    - secretKey: password
      remoteRef:
        key: REGISTRY_TOKEN
