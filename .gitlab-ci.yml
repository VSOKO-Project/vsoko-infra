stages:
  - validate
  - deploy
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS && $CI_PIPELINE_SOURCE == "push"
      when: never
    - if: $CI_COMMIT_BRANCH
variables:
  KUBE_CONTEXT: vsoko/vsoko-infra:vsoko

default:
  image:
    name: alpine/kubectl:1.37.1
    entrypoint: [""]
  tags:
    - saas-linux-small-amd64
  timeout: 10m

validate:
  stage: validate
  interruptible: true
  script:
    - cp .gitlab/ci/kustomization.validate.yaml kustomization.yaml
    - kubectl kustomize . > /dev/null
deploy:
  stage: deploy
  resource_group: vsoko-production
  environment:
    name: production
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_COMMIT_REF_PROTECTED == "true"'
      when: manual
  allow_failure: false
  manual_confirmation: "Развернуть инфраструктуру VSOKO в production?"
  script:
    - kubectl apply -f k8s/secrets/
    - kubectl -n vsoko wait --for=condition=Ready externalsecret/postgres-admin externalsecret/postgres-app
      externalsecret/redis externalsecret/gitlab-registry --timeout=120s
    - kubectl apply -f k8s/postgres/ -f k8s/redis/
    - kubectl -n vsoko rollout status statefulset/postgres --timeout=300s
    - kubectl -n vsoko rollout status statefulset/redis --timeout=300s
    - kubectl -n vsoko get pods,pvc,svc
  before_script:
    - kubectl config use-context "$KUBE_CONTEXT"
include:
  - local: .gitlab/ci/security.yml
