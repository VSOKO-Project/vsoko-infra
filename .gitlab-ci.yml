stages:
  - validate
  - deploy

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

variables:
  KUBE_CONTEXT: vsoko/vsoko-infra:vsoko

default:
  image:
    name: alpine/kubectl:1.37.1
    entrypoint: [""]
  tags:
    - saas-linux-small-amd64
  before_script:
    - kubectl config use-context "$KUBE_CONTEXT"
  timeout: 10m

validate:
  stage: validate
  interruptible: true
  script:
    - kubectl apply --dry-run=server -f k8s/secrets/databases.yml -f k8s/postgres/ -f k8s/redis/

deploy:
  stage: deploy
  resource_group: vsoko-production
  environment:
    name: production
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_COMMIT_REF_PROTECTED == "true"'
      when: manual
  allow_failure: false
  manual_confirmation: "Развернуть инфраструктуру VSOKO в production?"
  script:
    - kubectl apply -f k8s/secrets/databases.yml
    - kubectl -n vsoko wait --for=condition=Ready externalsecret/postgres-admin externalsecret/postgres-app externalsecret/redis --timeout=120s
    - kubectl apply -f k8s/postgres/ -f k8s/redis/
    - kubectl -n vsoko rollout status statefulset/postgres --timeout=300s
    - kubectl -n vsoko rollout status statefulset/redis --timeout=300s
    - kubectl -n vsoko get pods,pvc,svc
